name: Elixir CI

on:
  push:
    branches:
      - main
  pull_request:
  # The audit job needs a trigger that doesn't depend on us pushing: an advisory
  # is published on someone else's schedule. GHSA-rv48-qqj5-crxg sat in a shipped
  # release for ~2 weeks because nothing re-checked between pushes.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      # Fails the build on a retired package or a security advisory in the
      # resolved tree (`hex.audit` exits 1). Deliberately blocking: a HIGH in the
      # library that parses untrusted network input should stop a release, not
      # sit in a report nobody reads.
      #
      # NOTE this audits THIS repo's mix.lock. Consumers resolve our mix.exs
      # constraints against their own tree, so a fix here only reaches them if the
      # floor in mix.exs is raised too — see the 0.5.6 CHANGELOG.
      - name: mix hex.audit
        run: mix hex.audit

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    # The daily trigger exists for the audit job only — no need to re-run the
    # full matrix against unchanged code.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      # Cover the full declared support range (mix.exs: elixir ~> 1.18) across
      # distinct OTP versions. The newest pair is the dev/.tool-versions one;
      # format + warnings-as-errors run only there (older Elixir formats
      # differently and may warn on newer stdlib) — see the step `if`s below.
      matrix:
        include:
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
            primary: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      # Formatting can differ between Elixir versions — check only on primary.
      - name: Check formatting
        if: matrix.primary
        run: mix format --check-formatted

      # warnings-as-errors only on primary: older Elixir may emit deprecation
      # warnings on newer-stdlib calls that aren't real problems.
      - name: Compile (warnings as errors)
        if: matrix.primary
        run: mix compile --warnings-as-errors

      - name: Compile
        if: ${{ !matrix.primary }}
        run: mix compile

      # Blocking, as of the 0.5.8 cleanup: the backlog referenced by the old
      # non-blocking note is gone (`mix credo` reports no issues). `.credo.exs`
      # excludes the generated protobuf module and raises the nesting limit to 3,
      # both with reasons; every remaining complexity finding is disabled at its own
      # call site with a justification. So a new finding means new code, and should
      # fail rather than scroll past — the previous setup let `read_string`'s
      # complexity drift from 22 to 26 unnoticed.
      - name: Credo
        if: matrix.primary
        run: mix credo

      - name: Run tests
        run: mix test
